# Guards: 58 failed logins then success from a TOR exit node with MFA bypassed must
# conclude high+ — credential stuffing + MFA bypass is a clear account takeover signal.
name: high-cred-stuffing
alert: src/triage/evals/cases/alerts/high-cred-stuffing.json
expect:
  trajectory:
    must_call_tools: [lookup_user]                   # user account lookup is unavoidable
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed]
  verdict:
    severity_in: [high, critical]                    # 58 failures + TOR + MFA bypass = high+
    must_reference_entities: [dev-intern-jpark]
    confidence_min: 0.5
    verdict_has_findings_with_citations: true
reference:
  expected_tools:
    - name: lookup_user
  expected_severity: high
  expected_actions: [block_user]
  ordered: false
  exact: false
