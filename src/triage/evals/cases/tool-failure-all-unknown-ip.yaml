# Guards: multiple simultaneous reputation lookup failures (all IPs unknown to fixtures)
# must not crash the run — the agent must adapt to all tool failures and produce a verdict.
name: tool-failure-all-unknown-ip
alert: src/triage/evals/cases/alerts/tool-failure-all-unknown-ip.json
expect:
  trajectory:
    must_observe_tool_failure: true                  # all reputation lookups will return not-found
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed]
  verdict:
    severity_in: [low, medium, high, critical]       # any valid verdict — resilience is the point
    confidence_min: 0.0
    verdict_has_findings_with_citations: true
reference:
  expected_tools: []
  expected_severity: medium
  expected_actions: []
  ordered: false
  exact: false
