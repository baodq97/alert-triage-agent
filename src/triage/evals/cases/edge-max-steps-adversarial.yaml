# Guards: a complex 6-stage APT alert designed to exhaust investigation steps must
# still terminate gracefully — either completing or hitting max_steps cleanly with a verdict.
name: edge-max-steps-adversarial
alert: src/triage/evals/cases/alerts/edge-max-steps-adversarial.json
expect:
  trajectory:
    must_call_tools: [lookup_user]                   # at least one entity lookup is unavoidable
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed, max_steps]     # either is acceptable — graceful termination is the point
  verdict:
    severity_in: [medium, high, critical]            # multi-stage APT indicators = medium at minimum
    confidence_min: 0.0
    verdict_has_findings_with_citations: true
reference:
  expected_tools:
    - name: lookup_user
  expected_severity: high
  expected_actions: []
  ordered: false
  exact: false
