# Guards: ci-cd service account accessing out-of-scope accounts (HR, Finance) must conclude
# high+ — lateral movement from a privileged deployment account is critical.
name: high-lateral-move
alert: src/triage/evals/cases/alerts/high-lateral-move.json
expect:
  trajectory:
    must_call_tools: [lookup_user]                   # service account lookup is unavoidable
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed]
  verdict:
    severity_in: [high, critical]                    # out-of-scope cross-account access = high+
    must_reference_entities: [svc-deploy-prod]
    confidence_min: 0.5
    verdict_has_findings_with_citations: true
reference:
  expected_tools:
    - name: lookup_user
  expected_severity: high
  expected_actions: [block_user]
  ordered: false
  exact: false
