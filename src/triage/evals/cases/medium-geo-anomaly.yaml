# Guards: login from a foreign country with MFA passed and no prior indicators must land
# in the medium band — the agent must not over-dismiss (low) or over-escalate (critical).
name: medium-geo-anomaly
alert: src/triage/evals/cases/alerts/medium-geo-anomaly.json
expect:
  trajectory:
    must_call_tools: [lookup_user]                   # user account + MFA status are unavoidable
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed]
  verdict:
    severity_in: [low, medium, high]                 # mfa passed argues down; foreign geo argues up
    confidence_min: 0.3
    verdict_has_findings_with_citations: true
reference:
  expected_tools:
    - name: lookup_user
  expected_severity: medium
  expected_actions: []
  ordered: false
  exact: false
