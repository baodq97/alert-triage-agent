# Guards: an alert about a completely unknown entity where all tool lookups return
# not-found must still yield a verdict — no crash and no silent hang.
name: tool-failure-unknown-user
alert: src/triage/evals/cases/alerts/tool-failure-unknown-user.json
expect:
  trajectory:
    must_observe_tool_failure: true                  # the unknown entity must trigger at least one not-found
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed]
  verdict:
    severity_in: [low, medium, high, critical]       # point is a verdict exists at all; severity range is wide
    confidence_min: 0.0
    verdict_has_findings_with_citations: true
reference:
  expected_tools: []
  expected_severity: medium
  expected_actions: []
  ordered: false
  exact: false
