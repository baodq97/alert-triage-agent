# Guards: false-positive discipline — a benign off-hours login concludes LOW and
# takes no high-risk action (a verdict that over-escalates a clean login regresses).
name: benign
alert: src/triage/evals/cases/alerts/benign.json
judge_min: 50                              # stable sentinel — median-of-3 scores 78-85 band
expect:
  trajectory:
    must_call_tools: [lookup_user]                   # at least confirm the user before dismissing
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed]
  verdict:
    severity_in: [low]                               # zero-touch discipline: dare to say low
    confidence_min: 0.4
    verdict_has_findings_with_citations: true
reference:
  expected_tools:
    - name: lookup_user
  expected_severity: low
  expected_actions: []
  ordered: false
  exact: false
