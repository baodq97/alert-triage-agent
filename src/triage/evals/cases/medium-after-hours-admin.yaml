# Guards: legitimate read-only action at 03:05 UTC with no ticket must not conclude low
# AND must not conclude critical — it is an ambiguous medium signal warranting investigation.
name: medium-after-hours-admin
alert: src/triage/evals/cases/alerts/medium-after-hours-admin.json
expect:
  trajectory:
    must_call_tools: [lookup_user]                   # user account context is unavoidable
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed]
  verdict:
    severity_in: [low, medium]                       # read-only + mfa passed keeps this below high
    confidence_min: 0.3
    verdict_has_findings_with_citations: true
reference:
  expected_tools:
    - name: lookup_user
  expected_severity: medium
  expected_actions: []
  ordered: false
  exact: false
