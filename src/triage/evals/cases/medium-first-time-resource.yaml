# Guards: service account accessing a PII asset outside its normal scope for the first time
# with no ticket must not conclude low — first-time out-of-scope PII access warrants scrutiny.
name: medium-first-time-resource
alert: src/triage/evals/cases/alerts/medium-first-time-resource.json
expect:
  trajectory:
    must_call_tools: [lookup_user]                   # service account scope lookup is unavoidable
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed]
  verdict:
    severity_in: [low, medium, high]                  # PII + out-of-scope access, but read-only — a correct agent could also say low
    must_reference_entities: [svc-deploy-prod]
    confidence_min: 0.3
    verdict_has_findings_with_citations: true
reference:
  expected_tools:
    - name: lookup_user
  expected_severity: medium
  expected_actions: []
  ordered: false
  exact: false
