# Guards: read-only API calls to a PII endpoint with zero bytes exported from a known IP
# must conclude low — the agent must not over-escalate zero-impact access patterns.
name: benign-readonly-scan
alert: src/triage/evals/cases/alerts/benign-readonly-scan.json
expect:
  trajectory:
    must_call_tools: [lookup_user]                   # service account is the minimum lead
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed]
  verdict:
    severity_in: [low]                               # read-only, zero bytes, known IP = benign
    confidence_min: 0.3
    verdict_has_findings_with_citations: true
reference:
  expected_tools:
    - name: lookup_user
  expected_severity: low
  expected_actions: []
  ordered: false
  exact: false
