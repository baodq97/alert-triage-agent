# Guards: large PII export from a service account to an unexpected external IP must conclude
# high+ — anomalous IP + 3.8 GB PII egress is an unambiguous exfiltration signal.
name: high-exfil-s3
alert: src/triage/evals/cases/alerts/high-exfil-s3.json
expect:
  trajectory:
    must_call_tools: [lookup_user]                   # service account lookup is unavoidable
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed]
  verdict:
    severity_in: [high, critical]                    # unexpected IP + 3.8 GB PII export = high+
    must_reference_entities: [svc-deploy-prod]
    confidence_min: 0.5
    verdict_has_findings_with_citations: true
reference:
  expected_tools:
    - name: lookup_user
  expected_severity: high
  expected_actions: [block_user]
  ordered: false
  exact: false
