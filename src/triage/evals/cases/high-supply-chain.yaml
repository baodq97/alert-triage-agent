# Guards: CI/CD pipeline modification followed by cross-environment secrets access must
# conclude high+ — supply chain compromise on a deployment account is critical severity.
name: high-supply-chain
alert: src/triage/evals/cases/alerts/high-supply-chain.json
expect:
  trajectory:
    must_call_tools: [lookup_user]                   # service account lookup is unavoidable
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed]
  verdict:
    severity_in: [high, critical]                    # pipeline tamper + secrets exfil = critical
    must_reference_entities: [svc-deploy-prod]
    confidence_min: 0.5
    verdict_has_findings_with_citations: true
reference:
  expected_tools:
    - name: lookup_user
  expected_severity: critical
  expected_actions: [block_user]
  ordered: false
  exact: false
