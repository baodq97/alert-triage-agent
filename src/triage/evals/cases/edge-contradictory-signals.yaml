# Guards: same session flagged both benign (known device) and suspicious (foreign IP)
# must produce a verdict that acknowledges the conflict — neither dismiss nor over-escalate.
name: edge-contradictory-signals
alert: src/triage/evals/cases/alerts/edge-contradictory-signals.json
expect:
  trajectory:
    must_call_tools: [lookup_user]                   # user context is unavoidable given the account alert
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed]
  verdict:
    severity_in: [low, medium, high]                 # contradictory signals — wide range is appropriate
    confidence_min: 0.2
    verdict_has_findings_with_citations: true
reference:
  expected_tools:
    - name: lookup_user
  expected_severity: medium
  expected_actions: []
  ordered: false
  exact: false
