# Guards: the privilege-escalation scenario investigates the IAM user, concludes
# high+, and the gate fires before any response action.
#
# must_call_tools is the MINIMAL intrinsic set: skipping lookup_user on an IAM-user
# escalation alert indicates a plausibly-broken agent. get_asset_info / query_logs /
# check_reputation are legitimate-but-interchangeable second leads (a live recording
# investigated via lookup_user + query_logs + check_reputation and concluded
# correctly) — pinning any of them fails reasonable trajectories, against the
# eval-authoring principle that assertions fail on plausibly-broken agents only.
name: priv-esc
alert: src/triage/evals/cases/alerts/ALT-2026-04-7835-privilege-escalation.json
judge_min: 50                              # stable sentinel — median-of-3 scores 78-85 band
expect:
  trajectory:
    must_call_tools: [lookup_user]                   # the IAM user is the unavoidable lead
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed]
  verdict:
    severity_in: [medium, high, critical]            # self-attached AdministratorAccess, no ticket → not low
    must_reference_entities: [dev-intern-jpark]
    confidence_min: 0.4
    verdict_has_findings_with_citations: true
reference:
  expected_tools:
    - name: lookup_user
  expected_severity: high
  expected_actions: [block_user]
  ordered: false
  exact: false
