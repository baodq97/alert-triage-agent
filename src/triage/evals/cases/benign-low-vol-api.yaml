# Guards: very low volume read-only API calls well below threshold must conclude low —
# the agent must not escalate sub-threshold activity with no anomaly indicators.
name: benign-low-vol-api
alert: src/triage/evals/cases/alerts/benign-low-vol-api.json
expect:
  trajectory:
    must_call_tools: [lookup_user]                   # the named user is the minimum lead
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed]
  verdict:
    severity_in: [low]                               # 3 calls vs 100 threshold, read-only = benign
    confidence_min: 0.3
    verdict_has_findings_with_citations: true
reference:
  expected_tools:
    - name: lookup_user
  expected_severity: low
  expected_actions: []
  ordered: false
  exact: false
