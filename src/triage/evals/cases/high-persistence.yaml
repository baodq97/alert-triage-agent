# Guards: unauthorized admin account created outside provisioning with no ticket must
# conclude high+ — this is a textbook persistence mechanism and must trigger the gate.
name: high-persistence
alert: src/triage/evals/cases/alerts/high-persistence.json
expect:
  trajectory:
    must_call_tools: []                              # new unknown user — tool may return not-found
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed, no_progress]   # completed when the agent self-concludes; no_progress if unknown IAM user/policy cause K=6 consecutive failures
  verdict:
    severity_in: [high, critical]                    # manual console creation + immediate admin = high+
    confidence_min: 0.3
    verdict_has_findings_with_citations: true
reference:
  expected_tools: []
  expected_severity: high
  expected_actions: []
  ordered: false
  exact: false
