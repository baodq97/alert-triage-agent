# Guards: developer-readonly user self-attaching AdministratorAccess outside hours with no ticket
# must conclude high+ and fire the gate — a second priv-esc variant covering the
# full asset chain (user + role + policy all in fixture world).
name: high-priv-escalation-2
alert: src/triage/evals/cases/alerts/high-priv-escalation-2.json
expect:
  trajectory:
    must_call_tools: [lookup_user]                   # user profile unavoidable for this IAM event
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed]
  verdict:
    severity_in: [high, critical]                    # self-escalation to AdministratorAccess = high+
    must_reference_entities: [dev-intern-jpark]
    confidence_min: 0.5
    verdict_has_findings_with_citations: true
reference:
  expected_tools:
    - name: lookup_user
  expected_severity: high
  expected_actions: [block_user]
  ordered: false
  exact: false
