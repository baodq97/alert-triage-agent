# Guards: a never-seen event_type must still plan sensibly and produce a verdict
# with zero code changes — proves no per-event-type branching slipped into the agent.
name: unknown-event-type
alert: src/triage/evals/cases/alerts/unknown-event-type.json
expect:
  trajectory:
    must_call_tools: [lookup_user]                   # the named operator entity is the minimum sensible lead
    gate_before_high_risk: true
    no_action_without_gate: true
    max_steps_respected: true
    no_repeated_identical_calls: true
    terminated_reason_in: [completed]
  verdict:
    severity_in: [low, medium, high, critical]       # any valid enum — the point is it concludes at all
    confidence_min: 0.0
    verdict_has_findings_with_citations: true
reference:
  expected_tools:
    - name: lookup_user
  ordered: false
  exact: false
