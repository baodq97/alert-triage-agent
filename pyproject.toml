[project]
name = "alert-triage-agent"
version = "0.1.0"
description = "Autonomous security alert triage agent — plans investigations, chains tool reasoning, and gates high-risk actions behind human approval"
readme = "README.md"
authors = [
    { name = "Bao Do", email = "bao.do@nois.vn" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=2.41.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "triage"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # one-blank-line-before-class — conflicts with D211 (no-blank-line-before-class)
    "D213",   # multi-line-summary-second-line — conflicts with D212 (summary on first line)
    "COM812", # missing-trailing-comma — conflicts with the ruff formatter
    "ISC001", # single-line-implicit-string-concatenation — conflicts with the ruff formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the test mechanism in pytest
    "PLR2004", # magic values are expected in test assertions
    "D",       # docstrings on every test add noise, test names carry intent
    "INP001",  # tests/ is intentionally not a package (pytest rootdir discovery)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=triage --cov-branch --cov-report=term-missing"

[tool.coverage.report]
fail_under = 100
show_missing = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "ty>=0.0.44",
]
