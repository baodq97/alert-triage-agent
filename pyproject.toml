[project]
name = "alert-triage-agent"
version = "0.1.0"
description = "Autonomous security alert triage agent — plans investigations, chains tool reasoning, and gates high-risk actions behind human approval"
readme = "README.md"
authors = [
    { name = "Bao Do", email = "bao.do@nois.vn" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=2.41.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "triage"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # one-blank-line-before-class — conflicts with D211 (no-blank-line-before-class)
    "D213",   # multi-line-summary-second-line — conflicts with D212 (summary on first line)
    "COM812", # missing-trailing-comma — conflicts with the ruff formatter
    "ISC001", # single-line-implicit-string-concatenation — conflicts with the ruff formatter
]

[tool.ruff.lint.per-file-ignores]
"src/triage/threat_intel/classifier.py" = [
    "PLR0911", # classify_ioc has 7 ordered guard-clause returns — the linear
               # structure (step 0 through 4) is intentional, each return is a
               # distinct classification outcome; no refactor reduces the count
               # without hiding the algorithm behind an additional helper.
]
"tests/**" = [
    "S101",    # assert is the test mechanism in pytest
    "PLR2004", # magic values are expected in test assertions
    "D",       # docstrings on every test add noise, test names carry intent
    "INP001",  # tests/ is intentionally not a package (pytest rootdir discovery)
    "ANN401",  # test doubles use Any for generic payload/args parameters
    "ARG002",  # test doubles implement Protocol signatures with unused params
    "FBT003",  # test calls may pass boolean literals to prove both paths
]
"src/triage/rendering.py" = [
    "FBT001",  # observation_tag: ok is a domain boolean, not a flag — positional is intentional
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=triage --cov=run --cov-branch --cov-report=term-missing"
markers = [
    "live: Tier B live smoke — hits a real LLM endpoint; auto-skipped without LLM_API_KEY",
]

[tool.coverage.report]
fail_under = 100
show_missing = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "ty>=0.0.44",
]
